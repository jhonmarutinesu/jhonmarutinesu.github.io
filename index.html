<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>jhonmarutinesu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #faf7f0;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }
    h1 {
      font-size: 2rem;
      color: #2c2c2c;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 48px;
      font-size: 1rem;
    }
    .apps {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      max-width: 800px;
      width: 100%;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      padding: 32px 28px;
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card h2 {
      font-size: 1.4rem;
      color: #2c2c2c;
    }
    .card p {
      color: #555;
      font-size: 0.95rem;
      flex: 1;
    }
    .card a {
      display: inline-block;
      margin-top: 8px;
      color: #0b57d0;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .card a:hover { text-decoration: underline; }
    footer {
      margin-top: 64px;
      color: #aaa;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>My Apps</h1>
  <p class="subtitle">A collection of apps by jhonmarutinesu</p>

  <div class="apps">
    <div class="card">
      <h2>Teks Flip</h2>
      <p>A word game with Google Sign-In and leaderboard support.</p>
      <a href="teks-flip/privacy.html">Privacy Policy</a>
    </div>
    <div class="card">
      <h2>Smol</h2>
      <p>Coming soon.</p>
      <a href="smol/privacy.html">Privacy Policy</a>
    </div>
  </div>

  <footer>&copy; 2026 jhonmarutinesu</footer>
</body>
</html>
